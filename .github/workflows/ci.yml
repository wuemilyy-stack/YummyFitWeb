name: Reliability checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: yummyfit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d yummyfit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test-only-password@127.0.0.1:5432/yummyfit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build for a repository subdirectory
        run: npm run build
        env:
          VITE_SITE_BASE: /YummyFitWeb/
      - name: Check subdirectory links and routing
        run: npm run test:e2e
        env:
          E2E_SITE_BASE: /YummyFitWeb/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
